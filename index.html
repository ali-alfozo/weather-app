<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <!-- IMPORT GOOGLE ICONS -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=location_on,water_drop,air,search,dark_mode,light_mode" />
</head>
<body>
    <main class="main-container">
        <header class="input-container">
            <!-- زر تبديل الوضع الليلي -->
            <button class="theme-btn" id="themeToggle">
                <span class="material-symbols-outlined">dark_mode</span>
            </button>
            
            <!-- حقل البحث -->
            <input type="text" class="city-input" placeholder="Search City">
            
            <!-- زر البحث -->
            <button class="search-btn">
                <span class="material-symbols-outlined">search</span>
            </button>
        </header>

        
        <div class="loading-spinner" id="loadingSpinner" style="display:none;">
            <div class="spinner"></div>
        </div>

         <section class="weather-info" style="display:none;">
            <div class="location-date-container">
                <div class="location">
                    <span class="material-symbols-outlined">location_on</span>
                    <h4 class="country-txt">jakarta</h4>
                </div>
                <h5 class="current-date-txt regular-txt">wed, 07Aug</h5>
            </div>
            <div class="weather-summary-container">
                <img src="weather/clouds.svg" class="weather-summary-img" alt="Weather icon">
                <div class="weather-summary-info">
                    <h1 class="temp-txt">29 °C</h1>
                    <h3 class="condition-txt regular-txt">Clouds</h3>
                </div>
            </div>
            <div class="weather-conditions-container">
                <div class="condition-items">
                    <span class="material-symbols-outlined">water_drop</span>
                    <div class="condition-info">
                        <h5 class="regular-txt">Humidity</h5>
                        <h5 class="humidity-value-txt">55%</h5>
                    </div>
                </div>
                <div class="condition-items">
                    <span class="material-symbols-outlined">air</span>
                    <div class="condition-info">
                        <h5 class="regular-txt">Wind speed</h5>
                        <h5 class="wind-value-txt">2 km/h</h5>
                    </div>
                </div>
            </div>
            
            <div class="forecast-items-container"></div>
        </section>

        
        <section class="search-city section-message">
            <img src="weather/search-city.png" alt="Search City">
            <div>
                <h1>Search City</h1>
                <h4 class="regular-txt">Find out the weather conditions of the city</h4>
            </div>
        </section>

        
        <section class="not-found section-message" style="display:none;">
            <img src="weather/not-found.png" alt="City Not Found">
            <div>
                <h1>City Not Found</h1>
                <h4 class="regular-txt">Please check the city name and try again</h4>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
